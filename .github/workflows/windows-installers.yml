name: Windows installers

# Builds the NSIS installer and the portable exe on Windows (NSIS needs Wine elsewhere), installs the installer
# silently and runs the desktop smoke on the installed app. A pushed v* tag also puts the files in a draft release of
# this repo (the one electron-updater reads); the owner publishes it by hand. A manual run only keeps them as an artifact.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: windows-installers-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Tag matches package.json version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: pnpm build:win
      - name: Install silently (per user, default folder)
        shell: pwsh
        run: |
          $setup = Get-ChildItem dist -Filter "TLI-Planner-Setup-*.exe" | Select-Object -First 1
          Start-Process -FilePath $setup.FullName -ArgumentList "/S" -Wait
          $exe = Join-Path $env:LOCALAPPDATA "Programs\TLI Planner\TLI Planner.exe"
          if (-not (Test-Path $exe)) { throw "not installed: $exe" }
          "TLI_DESKTOP_EXECUTABLE=$exe" >> $env:GITHUB_ENV
          # An empty log folder: the bridge still loads the game log reader from app.asar and answers "not found".
          $logs = Join-Path $env:RUNNER_TEMP "game-logs"
          New-Item -ItemType Directory -Force $logs | Out-Null
          "TLI_GAME_LOG_DIR=$logs" >> $env:GITHUB_ENV
      - name: Desktop smoke on the installed app
        run: pnpm exec playwright test -c playwright.desktop.config.js
      - if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-traces
          path: test-results/
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: windows-installers
          path: |
            dist/*.exe
            dist/*.blockmap
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: windows-installers
          path: installers
      - name: Draft release with the installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "$GITHUB_REF_NAME" installers/*
          --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "$GITHUB_REF_NAME"
