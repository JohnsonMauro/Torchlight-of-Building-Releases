name: Report a calculation
description: The planner's damage for a skill differs from your in-game dummy test.
title: "[Calc] "
labels: [calculation-bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for testing! The planner's "Report calculation issue" button fills in the skill, hero, version and the planner's figures, and copies your build code: paste it into the Build code field below.
  - type: input
    id: skill
    attributes:
      label: Skill
      description: The skill you compared.
    validations:
      required: true
  - type: input
    id: hero
    attributes:
      label: Hero
    validations:
      required: false
  - type: textarea
    id: planner_figures
    attributes:
      label: Planner figures
      description: Filled in by the planner.
    validations:
      required: false
  - type: textarea
    id: ingame_figures
    attributes:
      label: In-game dummy numbers
      description: The numbers the in-game recount or panel shows.
    validations:
      required: true
  - type: dropdown
    id: window
    attributes:
      label: Which in-game figure?
      options:
        - Last 5 s average
        - Highest 5 s
        - Whole-run average
        - Character panel
        - Other
    validations:
      required: true
  - type: textarea
    id: test_setup
    attributes:
      label: Test setup
      description: Run duration, dummy level, conditions (standing still or moving, buffs, distance).
    validations:
      required: false
  - type: textarea
    id: suspect
    attributes:
      label: What you think is wrong
    validations:
      required: false
  - type: textarea
    id: build_code
    attributes:
      label: Build code
      description: Paste the code the button copied (or use Export in the planner).
      render: text
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshot or video links (you can also paste images here)
    validations:
      required: false
  - type: input
    id: app_version
    attributes:
      label: Planner version
      description: Filled in by the planner.
    validations:
      required: false
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Filled in by the planner (web or desktop).
    validations:
      required: false
